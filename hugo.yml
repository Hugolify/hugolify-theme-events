module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts

params:

  # Hugolify admin
  admin:
    collections:
      events:
        enable: true
        filter:
          - field: isIndex
            value: false
        icon:
          bootstrap_icons: calendar-event
          iconoir: calendar
          material_icons: event
          material_symbols: event
          lucide: calendar
        sortable_fields: [date, title]
        summary: "{{title}} - {{date | date('YYYY-MM-DD')}}"

  # Image
  events:
    thumbnail:
      desktop: '416x179'
      mobile: '300x129'
      scrollsnap: '240x103'
      sizes: 100vw, 50vw, 33vw

# Default
permalinks:
  page:
    events: /events/:slug/
